<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edge Control | אישור התקנת עמדת טעינה</title><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/app.css"><style>.declaration{background:#f8fafc;border:1px solid #dce3e8;border-radius:12px;padding:15px;line-height:1.9;font-size:14px}.preview-entry{display:inline-flex;flex-direction:column;gap:5px;margin:6px}.preview-entry img{max-width:180px;max-height:150px;object-fit:contain;border-radius:8px}.signature-canvas{touch-action:none}.sign-preview{max-width:230px;max-height:90px}.small-note{font-size:12px;color:#64748b}.report-section{break-inside:auto}.report-section h3{break-after:avoid}.report-images{break-inside:avoid} .report-images figure{margin:0}.report-images figcaption{font-size:11px;text-align:center}.action-status{font-size:13px;color:#166534}@media print{@page{size:A4;margin:11mm}.report-doc{padding:0}.report-section{break-inside:auto}.report-head{break-inside:avoid}.report-images img{max-height:115px}.report-section h3{background:#111!important;color:white!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}}</style></head><body><header class="topbar"><a class="back" href="index.html">← חזרה לטפסים</a><div class="page-title">אישור התקנת עמדת טעינה</div><img class="topbar-logo" src="assets/img/edge-logo.jpg" alt="Edge Control"></header><main class="wrap"><section class="panel" id="editor"><h1>אישור ביצוע התקנת עמדת טעינה</h1><p class="panel-sub">תיעוד ההתקנה ופרטי החשמלאי המבצע. מסמך זה אינו תעודת בדיקה או היתר הפעלה.</p><div class="autosave-note" id="saveStatus">טיוטה נשמרת בדפדפן זה בלבד</div><div class="form-grid" id="fields"></div><div class="actions"><button class="btn" id="makeReport" type="button">הצג דוח לאישור</button><button class="btn dark" type="button" id="printReport">שמור PDF / הדפס</button><button class="btn secondary" type="button" id="reset">נקה טיוטה</button></div></section><section class="report" id="report"><article class="report-doc" id="reportDoc"><header class="report-head"><img src="assets/img/edge-logo.jpg" alt="Edge Control"><div class="company-info"><strong>EDGE CONTROL</strong><div>אישור התקנה | INSTALLATION CERTIFICATE</div><div id="reportDate"></div></div></header><h2 class="report-title">אישור ביצוע התקנת עמדת טעינה לרכב חשמלי</h2><div id="sections"></div></article></section></main><script>
const declaration='אני החתום מטה מאשר כי עבודות התקנת עמדת הטעינה המפורטת במסמך זה בוצעו על ידי או באחריותי המקצועית, בהתאם לחוק החשמל ותקנותיו, להנחיות החלות על התקנת עמדות טעינה לרכב חשמלי ולהוראות היצרן, ככל שהן רלוונטיות לעבודות שבוצעו.';
const disclaimer='אישור זה מתייחס לעבודות ההתקנה המתוארות במסמך בלבד, ואינו מהווה תחליף לבדיקה ולאישור של חשמלאי בודק, ככל שנדרשים.';
const sections=[
['פרטי האתר וההתקנה',[['client','שם לקוח / בעל העמדה'],['site','שם האתר / מספר פרויקט'],['address','כתובת ההתקנה'],['installDate','תאריך התקנה','date'],['location','מיקום העמדה באתר']]],
['פרטי עמדת הטעינה',[['manufacturer','יצרן'],['importer','יבואן'],['model','דגם'],['serial','מספר סידורי (S/N)'],['chargerType','סוג עמדה','select:AC|DC'],['power','הספק נקוב (kW)','number'],['ratedCurrent','זרם נקוב (A)','number'],['connectors','סוג המחבר','select:שקע|כבל מובנה']]],
['תשתית החשמל וההזנה',[['feedSource','מקור הזנה / שם לוח מזין'],['cable','סוג ושטח חתך כבל הזנה (לדוגמה N2XY - 5x4)'],['supplyVoltage','מתח הזנה (V)'],['earthing','שיטת הגנה בפני חשמול','select:TT|TN-S|TN-C-S|אחר']]],
['אמצעי הגנה',[['breakerManufacturer','יצרן ודגם המפסק'],['breakerType','סוג מפסק','select:מא״ז|מפסק יצוק MCCB|מפסק משולב פחת RCBO|אחר'],['breakerPoles','בחירת הזנה','select:תלת פאזי|חד פאזי'],['breakerRating','זרם נקוב / כוונון מפסק (A)'],['rcdInstalled','הותקנה הגנת פחת מתאימה?','select:כן|לא|מובנית בעמדה|לא נבדק'],['rcdType','סוג הגנת פחת','select:Type A|Type B|Type F|RCBO|אחר|לא ידוע'],['rcdRating','זרם דלף נקוב (mA)'],['dcDetection','זיהוי זרם דלף DC של 6mA','select:מובנה בעמדה|יחידה חיצונית|לא קיים|לא ידוע'],['rcdLocation','מיקום התקנת הפחת']]],
['פרטי החשמלאי המבצע',[['electrician','שם מלא'],['licenseType','סוג רישיון'],['licenseNumber','מספר רישיון'],['company','חברה מבצעת'],['signDate','תאריך חתימה','date']]]
];
const F=document.getElementById('fields');let photos={},signature='';const KEY='edge-install-certificate-v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
for(const [title,arr] of sections){F.insertAdjacentHTML('beforeend','<div class="section-title">'+esc(title)+'</div>');for(const [key,label,type='text'] of arr){let ctl=type==='textarea'?'<textarea id="'+key+'" rows="3"></textarea>':type.startsWith('select:')?'<select id="'+key+'"><option value="">בחר...</option>'+type.substring(7).split('|').map(v=>'<option>'+esc(v)+'</option>').join('')+'</select>':'<input id="'+key+'" type="'+type+'">';F.insertAdjacentHTML('beforeend','<div class="field '+(type==='textarea'?'full':'')+'"><label for="'+key+'">'+esc(label)+'</label>'+ctl+'</div>')}}
F.insertAdjacentHTML('beforeend','<div class="section-title">תיעוד מצולם</div><div class="field full"><label>העלאת תמונות התקנה, לוח ותווית סידורית</label><input type="file" id="photos" accept="image/*" multiple><p class="small-note">התמונות נשמרות מקומית כטיוטה בדפדפן (בהתאם לנפח הזמין).</p><div class="img-preview" id="photoPreview"></div></div><div class="section-title">הצהרת החשמלאי וחתימה</div><div class="full declaration">'+esc(declaration)+'<br><strong>'+esc(disclaimer)+'</strong></div><div class="field full"><label>חתימה דיגיטלית של החשמלאי המבצע</label><canvas id="signature" class="signature-canvas" width="850" height="200" aria-label="אזור חתימה"></canvas><div class="actions"><button class="btn secondary" id="clearSignature" type="button">נקה חתימה</button></div></div>');
const formIds=sections.flatMap(x=>x[1].map(f=>f[0]));function values(){return Object.fromEntries(formIds.map(k=>[k,document.getElementById(k).value]))}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({fields:values(),photos,signature}));document.getElementById('saveStatus').textContent='טיוטה נשמרה במכשיר זה'}catch(e){document.getElementById('saveStatus').textContent='אין מקום לשמירת התמונות בדפדפן — מומלץ להפיק PDF'}}
try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');for(const [k,v] of Object.entries(saved.fields||{}))if(document.getElementById(k))document.getElementById(k).value=v;photos=saved.photos||{};signature=saved.signature||''}catch(e){}
F.addEventListener('input',e=>{if(e.target.id!=='photos'&&e.target.id!=='signature')persist()});F.addEventListener('change',e=>{if(e.target.id!=='photos')persist()});
const canvas=document.getElementById('signature'),ctx=canvas.getContext('2d');ctx.lineWidth=3;ctx.lineCap='round';ctx.strokeStyle='#111';function restoreSign(){ctx.clearRect(0,0,canvas.width,canvas.height);if(signature){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,canvas.width,canvas.height);img.src=signature}}restoreSign();
let drawing=false;function coord(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture(e.pointerId);let p=coord(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.1,p.y+.1);ctx.stroke()});canvas.addEventListener('pointermove',e=>{if(!drawing)return;let p=coord(e);ctx.lineTo(p.x,p.y);ctx.stroke()});function endDraw(){if(!drawing)return;drawing=false;signature=canvas.toDataURL('image/png');persist()}canvas.addEventListener('pointerup',endDraw);canvas.addEventListener('pointercancel',endDraw);document.getElementById('clearSignature').onclick=()=>{signature='';restoreSign();persist()};
function showPhotos(){document.getElementById('photoPreview').innerHTML=Object.entries(photos).map(([k,v])=>'<div class="preview-entry"><img src="'+v.data+'" alt=""><small>'+esc(v.name)+'</small><button class="btn warn" type="button" data-remove="'+esc(k)+'">הסר</button></div>').join('')}
document.getElementById('photoPreview').onclick=e=>{if(e.target.dataset.remove){delete photos[e.target.dataset.remove];showPhotos();persist()}};showPhotos();
document.getElementById('photos').onchange=async e=>{for(const file of e.target.files){if(!file.type.startsWith('image/'))continue;const img=new Image();const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});await new Promise(resolve=>{img.onload=resolve;img.onerror=resolve;img.src=data});const temp=document.createElement('canvas'),scale=Math.min(1,1200/(img.naturalWidth||1200));temp.width=Math.max(1,Math.round(img.naturalWidth*scale));temp.height=Math.max(1,Math.round(img.naturalHeight*scale));temp.getContext('2d').drawImage(img,0,0,temp.width,temp.height);photos[Date.now()+'-'+Math.random().toString(36).slice(2)]={name:file.name,data:temp.toDataURL('image/jpeg',.76)}}e.target.value='';showPhotos();persist()};
function reportField(label,val){return '<div class="report-field"><b>'+esc(label)+'</b><span>'+esc(val||'—')+'</span></div>'}
function render(){const v=values();let out='';for(const [title,arr] of sections){out+='<section class="report-section"><h3>'+esc(title)+'</h3><div class="report-grid">'+arr.map(([key,label])=>reportField(label,v[key])).join('')+'</div></section>'}
out+='<section class="report-section"><h3>תיעוד מצולם</h3><div class="report-images">'+(Object.values(photos).length?Object.values(photos).map(p=>'<figure><img src="'+p.data+'" alt="'+esc(p.name)+'"><figcaption>'+esc(p.name)+'</figcaption></figure>').join(''):'<span>לא צורפו תמונות</span>')+'</div></section>';
out+='<section class="report-section"><h3>הצהרת החשמלאי המבצע</h3><div class="declaration">'+esc(declaration)+'<br><strong>'+esc(disclaimer)+'</strong></div><div class="report-grid">'+reportField('שם החשמלאי',v.electrician)+reportField('מספר רישיון',v.licenseNumber)+reportField('תאריך',v.signDate)+'</div><div class="sig-wrap"><div class="sig-box">'+(signature?'<img class="sig-img" src="'+signature+'" alt="חתימת חשמלאי">':'חתימה לא צורפה')+'<div>חתימת החשמלאי המבצע</div></div></div></section>';
document.getElementById('sections').innerHTML=out;document.getElementById('reportDate').textContent='תאריך הפקת הדוח: '+new Date().toLocaleDateString('he-IL');document.getElementById('report').style.display='block'}
document.getElementById('makeReport').onclick=()=>{render();document.getElementById('report').scrollIntoView({behavior:'smooth'})};document.getElementById('printReport').onclick=()=>{if(!values().electrician||!values().serial){alert('יש למלא שם חשמלאי ומספר סידורי של העמדה לפני הפקת דוח');return}render();window.print()};document.getElementById('reset').onclick=()=>{if(!confirm('למחוק את הטיוטה המקומית כולל תמונות וחתימה?'))return;localStorage.removeItem(KEY);location.reload()};
</script></body></html>
